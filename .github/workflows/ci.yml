name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vfs
          POSTGRES_PASSWORD: vfs
          POSTGRES_DB: vfs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vfs"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      SQLITE_REMOTE_TEST_DATABASE_URL: postgres://vfs:vfs@localhost:5432/vfs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./cmd/sqlite-remote-server
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  generated:
    name: Generated code and protocol
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # proto/ must equal the protocol of the sqlite-remote-vfs commit named in proto/SOURCE.
      - name: Protocol matches sqlite-remote-vfs
        run: |
          commit=$(awk '{print $2}' proto/SOURCE)
          git clone --quiet https://github.com/SchwarzDigits/sqlite-remote-vfs.git "$RUNNER_TEMP/vfs"
          git -C "$RUNNER_TEMP/vfs" checkout --quiet "$commit"
          scripts/sync-proto.sh --check "$RUNNER_TEMP/vfs"
      # The generated Go code must match proto/ and queries.sql.
      - name: Generated code is current
        run: |
          go tool buf generate
          go tool sqlc generate
          git diff --exit-code
